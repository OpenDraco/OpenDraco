[pytest]
pythonpath = .
# Collect only the test package. Without this, pytest walks the whole tree and
# tries to import evaluation artefacts -- results/evaluations/.../test_output.txt
# matches python_files and blows up collection with dozens of errors.
testpaths = opendraco/tests
norecursedirs = .git .venv node_modules SWE-bench results app dist build *.egg-info
markers =
    integration: tests that require external services (e.g. Ollama)
    slow: tests that take a long time to run
# Drop the warning-summary section entirely. The only repeat offender is
# `langgraph.cache.base`'s `LangChainPendingDeprecationWarning` about
# `allowed_objects`, which langchain_core actively force-surfaces
# (see surface_langchain_deprecation_warnings) — per-test `filterwarnings`
# entries can't beat it. Every warning we'd actually care about is a
# test failure surfaced directly, so the summary block is pure noise.
addopts = --disable-warnings
