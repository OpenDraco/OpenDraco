# Serves the built Angular app. Port 4200 matches the CORS origin pinned in
# api/server.py, so the browser talks to the API exactly as in a dev setup.
server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are Angular routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # a stale shell keeps loading assets that no longer exist.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
