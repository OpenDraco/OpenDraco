name: Mirror to public repo

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Commit message for the public mirror snapshot'
        required: false
        default: 'sync: snapshot from private master'
  push:
    tags: ['v*']

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  PUBLIC_REPO: xiangfengyepan/TFG_public
  PUBLIC_BRANCH: main
  PUBLIC_SUBDIR: EvoMas-master

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage a sanitized snapshot
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          # Leading-slash patterns anchor to the repo root (mirrors the
          # .gitignore convention). Without the slash, rsync would match
          # `notebook-*/` and `logs/` anywhere — including the
          # `experiments/notebook-X-5custom/` runs and their per-instance
          # `predictions/logs/` subdirs that we explicitly want to mirror.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='/results/' \
            --exclude='/logs/' \
            --exclude='/old_logs/' \
            --exclude='/SWE-bench/' \
            --exclude='/sb-cli/' \
            --exclude='/notebook-*/' \
            --exclude='/notebook-*.ipynb' \
            --exclude='/swebench_*.jsonl' \
            --exclude='/custom_instances.jsonl' \
            --exclude='/evomas.egg-info/' \
            --exclude='evomas/config/loaded/' \
            --exclude='evomas/venv/' \
            --exclude='**/__pycache__/' \
            --exclude='**/node_modules/' \
            --exclude='app/dist/' \
            ./ "$STAGE/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Update EvoMas-master subdir in public repo
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MSG: ${{ github.event.inputs.message || format('release {0}', github.ref_name) }}
        run: |
          set -euo pipefail
          PUBLIC=$(mktemp -d)
          git clone --depth=1 --branch "$PUBLIC_BRANCH" \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${PUBLIC_REPO}.git" \
            "$PUBLIC"
          cd "$PUBLIC"
          git config user.name  "evomas-mirror[bot]"
          git config user.email "evomas-mirror@users.noreply.github.com"
          # Replace the EvoMas-master/ subtree with the staged snapshot.
          # rsync --delete prunes files that no longer exist in source, scoped
          # to this subdir only — sibling folders (First_Part_Analysis/,
          # framework-master/, LICENSE.txt, README.md) are left untouched.
          mkdir -p "$PUBLIC_SUBDIR"
          rsync -a --delete "$STAGE/" "$PUBLIC_SUBDIR/"
          git add -A "$PUBLIC_SUBDIR"
          if git diff --cached --quiet; then
            echo "no changes in $PUBLIC_SUBDIR — nothing to mirror"
            exit 0
          fi
          git commit -q -m "$MSG" -m "Source: ${GITHUB_SHA}"
          git push origin "$PUBLIC_BRANCH"
