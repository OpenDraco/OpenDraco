<!-- Bottom palette: one chip per domain agent type, plus a separate
     "Control" lane for graph control-flow primitives (Router). Each
     chip has a dropdown listing the EvoMas built-in + every CSV-derived
     alternative for that role; drag drops a node seeded with the
     picked variant's prompts + tools (see onGraphDrop). -->
<div class="agent-palette">
  <span class="palette-label">Drag a type →</span>
  @for (t of domainTypes; track t.type) {
    <evo-agent-type-picker
      [agentType]="t.type"
      [color]="t.color"
      [variants]="variantsFor(t.type)"
      [selectedVariantKey]="selectedVariantKey(t.type)"
      [draggable]="isLoadedConfig"
      (variantChange)="onVariantChange(t.type, $event)" />
  }

  @if (controlTypes.length > 0) {
    <span class="palette-divider" aria-hidden="true"></span>
    <span class="palette-label palette-label--control">Control →</span>
    @for (t of controlTypes; track t.type) {
      <evo-agent-type-picker
        [agentType]="t.type"
        [color]="t.color"
        [variants]="variantsFor(t.type)"
        [selectedVariantKey]="selectedVariantKey(t.type)"
        [draggable]="isLoadedConfig"
        (variantChange)="onVariantChange(t.type, $event)" />
    }
  }

  @if (agentTypes.length === 0) {
    <span class="palette-label" style="opacity:.6">Loading types…</span>
  }
</div>
