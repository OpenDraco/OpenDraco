<div class="results-layout">

  <app-instance-tree-picker
      [instances]="instances"
      [filteredInstances]="filteredInstances"
      [jobGroups]="jobGroups"
      [loading]="loading"
      [selectedId]="selectedId"
      [selectedRunId]="selectedRunId"
      [filter]="filter"
      [groupByInstance]="groupByInstance"
      [openJobs]="openJobs"
      (filterChange)="filter = $event"
      (groupByInstanceChange)="groupByInstance = $event"
      (refresh)="refresh()"
      (selectInstance)="selectInstance($event)"
      (selectInstanceInJob)="selectInstanceInJob($event)"
      (toggleJob)="toggleJob($event)" />

  <div class="center-col">
    @if (!selectedId) {
      <div class="center-hint">
        <div>Select an instance to view its prediction and evaluation</div>
      </div>
    } @else {
      <draco-box [title]="selectedId!" class="header-box">
        <div class="run-pickers">
          <div class="picker-block" style="flex: 1;">
            <label class="field-label">Run</label>
            @if (current!.runs.length === 0) {
              <div class="empty-hint sm">— no runs —</div>
            } @else {
              <div class="run-row">
                <draco-select panel
                            [options]="runOptions"
                            [ngModel]="selectedRunId"
                            (ngModelChange)="selectRun($event)" />
                <draco-button size="sm"
                            [disabled]="!predictionConfigJson"
                            title="Download the unified-config JSON used to produce this run"
                            (clicked)="downloadPredictionConfig()"><ng-icon name="download" /> Config</draco-button>
                <draco-button size="sm"
                            [disabled]="!selectedPredFile"
                            title="Download a Jupyter notebook that reproduces this run end-to-end (inference + evaluation), with the exact config + instance ids inlined."
                            (clicked)="downloadNotebook()"><ng-icon name="download" /> Notebook</draco-button>
              </div>
            }
          </div>
        </div>
      </draco-box>

      <div class="view-tabs" role="tablist">
        <button class="tab" role="tab"
                [class.active]="resultsView === 'overview'"
                [attr.aria-selected]="resultsView === 'overview'"
                (click)="showResultsView('overview')">Prediction &amp; evaluation</button>
        <button class="tab" role="tab"
                [class.active]="resultsView === 'graphectory'"
                [attr.aria-selected]="resultsView === 'graphectory'"
                (click)="showResultsView('graphectory')"><ng-icon name="graph" /> Graphectory</button>
      </div>

      <div class="inner-grid" [class.view-hidden]="resultsView !== 'overview'">
        <app-prediction-panel
            [prediction]="prediction"
            [selectedPredFile]="selectedPredFile"
            [predictionLog]="predictionLog"
            [predictionLogMissing]="predictionLogMissing"
            [predictionLogPath]="predictionLogPath"
            [predictionConfigJson]="predictionConfigJson"
            [predictionTimestamp]="predictionTimestamp"
            [predictionEndTimestamp]="predictionEndTimestamp"
            [predictionDuration]="predictionDuration"
            [predictionConfigUsed]="predictionConfigUsed"
            [showPredictionLog]="showPredictionLog"
            [diffLines]="diffLines()"
            (downloadPrediction)="downloadPrediction()"
            (reveal)="reveal($event)"
            (downloadPredictionLog)="downloadPredictionLogFile()"
            (openLogViewer)="openLogViewer()"
            (togglePredictionLog)="togglePredictionLog($event)" />

        <app-evaluation-panel
            [selectedEvalDir]="selectedEvalDir"
            [evaluation]="evaluation"
            [selectedPredFile]="selectedPredFile"
            [resolvedFlag]="resolvedFlag()"
            [testStatus]="testStatus()"
            [showLogs]="showLogs"
            [activeLog]="activeLog"
            [isCustomInstance]="isCustomInstance"
            [loadingLog]="loadingLog"
            [logContent]="logContent"
            [coloredLog]="coloredLog()"
            (downloadZip)="downloadZip()"
            (reveal)="reveal($event)"
            (goEvaluate)="goEvaluate()"
            (toggleLogs)="toggleLogs($event)"
            (setActiveLog)="setActiveLog($event)"
            (downloadLog)="downloadLog()" />
      </div>

      <app-graphectory-panel
          [class.view-hidden]="resultsView !== 'graphectory'"
          [configured]="graphectoryConfigured"
          [missing]="graphectoryMissing"
          [serverUrl]="graphectoryUrl"
          [selectedPredFile]="selectedPredFile"
          [state]="graphectoryState"
          [link]="graphectoryLink"
          [error]="graphectoryError"
          (analyze)="analyzeInGraphectory()"
          (openInNewTab)="openGraphectoryInNewTab($event)" />
    }

    @if (error) {
      <div class="error-banner">{{ error }}</div>
    }
  </div>
</div>

<app-log-viewer-modal
    [open]="logViewOpen"
    [loading]="logViewLoading"
    [error]="logViewError"
    [title]="logViewTitle"
    [logFileName]="logViewFileName"
    [predictionsLogsDir]="predictionsLogsDir"
    [instance]="logViewInstance"
    (close)="closeLogViewer()" />
