<div class="eval-layout">
  <app-eval-config-panel
      [predictionOptions]="predictionOptions"
      [predictionsPath]="predictionsPath"
      (predictionsPathChange)="setPredictionsPath($event)"
      [filePickerError]="filePickerError"
      [predictionsDir]="predictionsDir"
      (predictionFileChosen)="onPredictionFileChosen($event)"
      (refreshPredictions)="loadPredictions()"
      [maxWorkers]="maxWorkers"
      (maxWorkersChange)="setMaxWorkers($event)"
      [evaluatorOptions]="evaluatorOptions"
      [evaluator]="evaluator"
      (evaluatorChange)="setEvaluator($event)"
      [inspection]="inspection"
      [inspectionLoading]="inspectionLoading"
      [inspectionError]="inspectionError"
      [isCustomOnly]="isCustomOnly"
      [hasCustomMixed]="hasCustomMixed"
      [running]="running"
      [progressPercent]="progressPercent"
      [progressDone]="progressDone"
      [progressTotal]="progressTotal"
      [stats]="stats"
      [returnCode]="returnCode"
      [errorMsg]="errorMsg"
      (run)="run()"
      (cancel)="cancel()" />

  <app-eval-log-panel
      [logs]="logs"
      [running]="running"
      (clearLogs)="clearLogs()" />
</div>
